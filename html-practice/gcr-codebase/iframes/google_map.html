<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

<h2>Mathura Map</h2>

<!-- loading="lazy" loads the map only when it is close to becoming visible. -->
<iframe
    title="Google Map of Mathura"
    width="600"
    height="450"
    loading="lazy"
    src="https://www.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh&output=embed">
</iframe>

</body>
</html>
