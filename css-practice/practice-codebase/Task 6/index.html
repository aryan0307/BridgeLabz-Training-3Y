<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Running Shoes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="product-card">

    <div class="product-image">
      <img src="joota.avif" alt="Premium red running shoe">

      <span class="discount">20% OFF</span>

      <button class="wishlist" aria-label="Add to wishlist">♡</button>
    </div>

    <div class="product-info">

      <span class="category">SPORTS SHOES</span>

      <h2>Premium Running Shoes</h2>

      <div class="rating">
        <span>★ ★ ★ ★ ★</span>
        <span class="reviews">(120)</span>
      </div>

      <div class="price-row">
        <span class="price">₹1,999</span>
        <span class="old-price">₹2,499</span>
      </div>

      <button class="cart-btn">Add to Cart</button>

    </div>
  </div>

</body>
</html>
