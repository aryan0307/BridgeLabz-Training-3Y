<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <h1>CSS Animation Showcase</h1>
            <p>Demonstrating @keyframes, animation-delay, iteration count, and direction.</p>
        </header>

        <!-- Centered Flexbox Animation Showcase -->
        <main class="animation-container">
            <!-- Animated Element 1: Moving Box -->
            <div class="animation-card">
                <h3>1. Moving Box</h3>
                <div class="stage">
                    <div class="moving-box"></div>
                </div>
                <code>animation-direction: alternate</code>
            </div>

            <!-- Animated Element 2: Bouncing Ball -->
            <div class="animation-card">
                <h3>2. Bouncing Ball</h3>
                <div class="stage">
                    <div class="bouncing-ball"></div>
                </div>
                <code>animation-delay: 0.3s</code>
            </div>

            <!-- Animated Element 3: Color-Changing Text -->
            <div class="animation-card">
                <h3>3. Color-Changing Text</h3>
                <div class="stage">
                    <span class="color-text">CSS3 Glow</span>
                </div>
                <code>animation-iteration-count: infinite</code>
            </div>
        </main>
    </div>
</body>
</html>
