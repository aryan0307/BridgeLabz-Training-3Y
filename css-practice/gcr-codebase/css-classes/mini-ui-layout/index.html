<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Mini User Interface Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Component -->
        <header class="app-header">
            <div class="header-inner">
                <div class="logo">
                    <span class="logo-icon">⚡</span>
                    <span class="logo-text">PulseApp</span>
                </div>
                <nav class="nav-links">
                    <a href="#" class="nav-item active">Dashboard</a>
                    <a href="#" class="nav-item">Settings</a>
                </nav>
            </div>
        </header>

        <!-- Main Content Section -->
        <main class="main-content">
            <!-- Compact Main Card -->
            <div class="main-card">
                <!-- Top Section: Small Image & Card Profile Info -->
                <div class="card-hero">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="User Profile Thumbnail" class="profile-img">
                    <div class="hero-text">
                        <h2>User Preferences</h2>
                        <p>Update your account details and subscription preferences.</p>
                    </div>
                </div>

                <!-- Form Section inside Main Card -->
                <form class="user-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="userName">Display Name</label>
                            <input type="text" id="userName" class="form-control" placeholder="Jane Doe" value="Jane Doe">
                        </div>
                        <div class="form-group">
                            <label for="userEmail">Email Address</label>
                            <input type="email" id="userEmail" class="form-control" placeholder="jane@example.com" value="jane@example.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="accountTier">Account Plan</label>
                        <select id="accountTier" class="form-control select-control">
                            <option value="pro">Pro Developer ($19/mo)</option>
                            <option value="team">Team Edition ($49/mo)</option>
                            <option value="enterprise">Enterprise Custom</option>
                        </select>
                    </div>

                    <!-- Action Buttons inside Main Card -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-save">Save Changes</button>
                        <button type="reset" class="btn btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </main>

        <!-- Footer Component -->
        <footer class="app-footer">
            <p>© 2026 PulseApp Mini UI Showcase. Crafted with CSS Flexbox & Box Model.</p>
        </footer>
    </div>
</body>
</html>
