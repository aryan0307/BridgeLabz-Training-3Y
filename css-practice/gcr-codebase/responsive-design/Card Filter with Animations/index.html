<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Our Team</h1>
    </header>

    <main>
        <section class="profile-container" aria-label="Team Profiles">

            <article class="profile-card">
                <img
                    src="https://i.pravatar.cc/400?img=12"
                    alt="Profile of Alex">
                <div class="profile-content">
                    <h2>Alex</h2>
                    <p>Frontend Developer</p>
                </div>
            </article>

            <article class="profile-card">
                <img
                    src="https://i.pravatar.cc/400?img=32"
                    alt="Profile of Sarah">
                <div class="profile-content">
                    <h2>Sarah</h2>
                    <p>UI/UX Designer</p>
                </div>
            </article>

            <article class="profile-card">
                <img
                    src="https://i.pravatar.cc/400?img=56"
                    alt="Profile of John">
                <div class="profile-content">
                    <h2>John</h2>
                    <p>Backend Developer</p>
                </div>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Our Team</p>
    </footer>

</body>
</html>
