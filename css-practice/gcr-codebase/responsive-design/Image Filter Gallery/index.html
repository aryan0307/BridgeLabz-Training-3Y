
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery" aria-label="Image Filter Gallery">

            <figure class="gallery-item">
                <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain landscape">
                <figcaption>Blur</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="grayscale" src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <figcaption>Grayscale</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="sepia" src="https://picsum.photos/id/1035/500/350" alt="Mountain scenery">
                <figcaption>Sepia</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="brightness" src="https://picsum.photos/id/1043/500/350" alt="Nature">
                <figcaption>Brightness</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="contrast" src="https://picsum.photos/id/1050/500/350" alt="Forest">
                <figcaption>Contrast</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="hue" src="https://picsum.photos/id/1069/500/350" alt="Beach">
                <figcaption>Hue Rotate</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Filter Gallery</p>
    </footer>

</body>
</html>
