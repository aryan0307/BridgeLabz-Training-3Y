<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <h1>CSS Transformations Showcase</h1>
            <p>Hover over each card below to see 2D CSS transformations in action.</p>
        </header>

        <main class="transform-container">
            <!-- Box 1: Rotate -->
            <div class="card">
                <div class="box rotate-box">
                    <span class="icon">🔄</span>
                </div>
                <div class="label">
                    <h3>Rotate</h3>
                    <code>rotate(45deg)</code>
                </div>
            </div>

            <!-- Box 2: Scale -->
            <div class="card">
                <div class="box scale-box">
                    <span class="icon">🔍</span>
                </div>
                <div class="label">
                    <h3>Scale</h3>
                    <code>scale(1.2)</code>
                </div>
            </div>

            <!-- Box 3: Translate -->
            <div class="card">
                <div class="box translate-box">
                    <span class="icon">🚀</span>
                </div>
                <div class="label">
                    <h3>Translate</h3>
                    <code>translateY(-20px)</code>
                </div>
            </div>

            <!-- Box 4: Skew -->
            <div class="card">
                <div class="box skew-box">
                    <span class="icon">📐</span>
                </div>
                <div class="label">
                    <h3>Skew</h3>
                    <code>skewX(15deg)</code>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
