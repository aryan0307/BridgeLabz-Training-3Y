<!DOCTYPE html>
<html>
<head>
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Advanced CSS Selectors</h1>

    <h2>Attribute Selectors</h2>

    <input type="text" placeholder="Enter your name">
    <br><br>

    <a href="https://www.google.com">HTTPS Link</a>

    <h2>Pseudo Classes</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

    <h2>Combinators</h2>

    <div class="box">
        <p>Direct child paragraph</p>

        <div>
            <p>Nested paragraph</p>
        </div>
    </div>

    <h3>Heading 3</h3>
    <p>Adjacent sibling paragraph</p>
    <p>Another sibling paragraph</p>

    <div class="descendant">
        <section>
            <p>Descendant paragraph</p>
        </section>
    </div>

</body>
</html>
