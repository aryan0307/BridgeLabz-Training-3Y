<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Mountain">
            <div class="caption">Mountain View</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
            <div class="caption">Beautiful Beach</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Lake">
            <div class="caption">Peaceful Lake</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1511497584788-876760111969" alt="Nature">
            <div class="caption">Nature</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e" alt="Landscape">
            <div class="caption">Amazing Landscape</div>
        </div>

    </div>

</body>
</html>
