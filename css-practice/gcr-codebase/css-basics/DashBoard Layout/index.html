<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>My Dashboard</h2>
        <div class="profile">Admin</div>
    </header>

    <div class="dashboard">

        <aside>
            <h3>Navigation</h3>

            <nav>
                <a href="#">Home</a>
                <a href="#">Analytics</a>
                <a href="#">Users</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <main class="content">

            <h1>Dashboard Overview</h1>

            <div class="boxes">

                <div class="box">
                    <h2>Users</h2>
                    <p class="number">1,250</p>
                    <p>Total registered users</p>
                </div>

                <div class="box">
                    <h2>Revenue</h2>
                    <p class="number">₹85,000</p>
                    <p>Total monthly revenue</p>
                </div>

                <div class="box">
                    <h2>Orders</h2>
                    <p class="number">540</p>
                    <p>Orders this month</p>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
