<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4">

        <h1>Tech Store</h1>

        <p class="mb-0">
            Quality products at great prices
        </p>

    </header>

    <!-- Product Catalog -->
    <main class="container py-5">

        <h2 class="text-center mb-5">
            Our Products
        </h2>

        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">

                    <img
                        src="https://picsum.photos/id/1/400/300"
                        class="card-img-top"
                        alt="Laptop"
                    >

                    <div class="card-body text-center">

                        <h3 class="card-title h5">
                            Laptop
                        </h3>

                        <p class="fw-bold">
                            ₹55,000
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">

                    <img
                        src="https://picsum.photos/id/20/400/300"
                        class="card-img-top"
                        alt="Headphones"
                    >

                    <div class="card-body text-center">

                        <h3 class="card-title h5">
                            Headphones
                        </h3>

                        <p class="fw-bold">
                            ₹2,499
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">

                    <img
                        src="https://picsum.photos/id/96/400/300"
                        class="card-img-top"
                        alt="Smart Watch"
                    >

                    <div class="card-body text-center">

                        <h3 class="card-title h5">
                            Smart Watch
                        </h3>

                        <p class="fw-bold">
                            ₹3,999
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">

                    <img
                        src="https://picsum.photos/id/160/400/300"
                        class="card-img-top"
                        alt="Camera"
                    >

                    <div class="card-body text-center">

                        <h3 class="card-title h5">
                            Camera
                        </h3>

                        <p class="fw-bold">
                            ₹42,000
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>
            </div>

        </div>

    </main>

</body>
</html>
