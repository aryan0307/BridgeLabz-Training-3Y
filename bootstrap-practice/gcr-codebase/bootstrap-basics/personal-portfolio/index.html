<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light text-dark">

    <!-- Header -->
    <header class="container text-center mt-4">

        <h1 class="fw-bold">
            Aryan
        </h1>

        <p class="lead">
            Computer Science Engineering Student & Developer
        </p>

    </header>

    <!-- Main Content -->
    <main class="container text-center">

        <!-- Profile -->
        <section class="p-5">

            <img
                src="https://i.pravatar.cc/250"
                alt="Profile Picture"
                class="img-fluid rounded-circle mb-3 profile-image"
            >

            <h2 class="fw-bold">
                Hello, I'm Aryan
            </h2>

            <p class="mt-4 mb-3">
                I enjoy building websites, applications and
                machine learning projects.
            </p>

            <!-- Buttons -->
            <div class="mt-4">

                <button class="btn btn-primary me-2">
                    Hire Me
                </button>

                <button class="btn btn-outline-dark">
                    Download CV
                </button>

            </div>

        </section>

        <!-- Contact Form -->
        <section class="contact-section p-5">

            <h2 class="fw-bold mb-3">
                Contact Me
            </h2>

            <form>

                <div class="mb-3 text-start">
                    <label for="name" class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your name"
                    >
                </div>

                <div class="mb-3 text-start">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                    >
                </div>

                <div class="mb-3 text-start">
                    <label for="message" class="form-label">
                        Message
                    </label>

                    <textarea
                        id="message"
                        class="form-control"
                        rows="4"
                        placeholder="Write your message">
                    </textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 mt-4">
        <p>
            &copy; 2026 Aryan. All Rights Reserved.
        </p>
    </footer>

</body>
</html>
