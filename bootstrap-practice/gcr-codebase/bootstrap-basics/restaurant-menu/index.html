<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center py-5">

        <div class="container">

            <h1>
                The Golden Plate
            </h1>

            <p class="lead mb-0">
                Today's Special Menu
            </p>

        </div>

    </header>

    <main class="container py-5">

        <!-- Menu Section -->
        <section>

            <h2 class="text-center mb-4">
                Today's Menu
            </h2>

            <!-- Bootstrap Table -->
            <div class="table-responsive">

                <table class="table table-striped table-bordered text-center">

                    <thead class="table-dark">

                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Price</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <td>Paneer Tikka</td>
                            <td>Starter</td>
                            <td>₹220</td>
                        </tr>

                        <tr>
                            <td>Veg Biryani</td>
                            <td>Main Course</td>
                            <td>₹280</td>
                        </tr>

                        <tr>
                            <td>Butter Naan</td>
                            <td>Bread</td>
                            <td>₹60</td>
                        </tr>

                        <tr>
                            <td>Chocolate Brownie</td>
                            <td>Dessert</td>
                            <td>₹150</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

        <!-- Chef's Specials -->
        <section class="my-5">

            <h2 class="text-center mb-4">
                Chef's Specials
            </h2>

            <div class="list-group">

                <div class="list-group-item">
                    Special Paneer Tikka
                </div>

                <div class="list-group-item">
                    Chef's Vegetable Biryani
                </div>

                <div class="list-group-item">
                    Special Chocolate Brownie
                </div>

            </div>

        </section>

        <!-- Food Image -->
        <section class="text-center">

            <figure>

                <img
                    src="https://picsum.photos/id/292/800/500"
                    alt="Delicious restaurant food"
                    class="img-fluid rounded"
                >

                <figcaption class="mt-3 text-muted">
                    Freshly prepared special dish of the day
                </figcaption>

            </figure>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            &copy; 2026 The Golden Plate
        </p>

    </footer>

</body>
</html>
