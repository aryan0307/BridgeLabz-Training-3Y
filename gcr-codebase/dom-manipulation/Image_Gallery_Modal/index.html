<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Image Gallery Modal</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><h1>Image Gallery</h1><p>Click an image to preview it.</p><div class="gallery" id="gallery">
<img src="https://picsum.photos/id/1015/400/280" alt="Mountain river">
<img src="https://picsum.photos/id/1016/400/280" alt="Mountain landscape">
<img src="https://picsum.photos/id/1025/400/280" alt="Dog portrait">
<img src="https://picsum.photos/id/1035/400/280" alt="Forest path">
<img src="https://picsum.photos/id/1043/400/280" alt="Coastal view">
<img src="https://picsum.photos/id/1069/400/280" alt="Nature scene">
</div></main>
<div id="imageModal" class="modal" aria-hidden="true"><div class="modal-content"><button id="closeModal" type="button" aria-label="Close">×</button><img id="modalImage" src="" alt="Expanded preview"><p id="modalCaption"></p></div></div>
<script src="script.js"></script></body></html>
