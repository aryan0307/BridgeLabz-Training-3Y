<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Custom Dropdown</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><h1>Custom Dropdown</h1><div class="dropdown" id="dropdown"><button id="dropdownButton" type="button" aria-expanded="false">Choose a course ▾</button><ul id="dropdownOptions" hidden><li><button type="button" data-value="JavaScript">JavaScript</button></li><li><button type="button" data-value="Python">Python</button></li><li><button type="button" data-value="Java">Java</button></li><li><button type="button" data-value="C++">C++</button></li></ul></div><p id="selection">No course selected.</p></main><script src="script.js"></script></body></html>
