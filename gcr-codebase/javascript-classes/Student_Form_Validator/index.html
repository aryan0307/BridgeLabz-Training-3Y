<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Form Validator</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><h1>Student Registration</h1><form id="studentForm" novalidate>
<label>Name<input id="name" type="text" placeholder="Your name"><small></small></label>
<label>Email<input id="email" type="email" placeholder="example@domain.com"><small></small></label>
<label>Phone<input id="phone" type="tel" placeholder="10-digit phone number"><small></small></label>
<label>Password<input id="password" type="password" placeholder="Password"><small></small></label>
<button type="submit">Validate & Submit</button></form><p id="status" aria-live="polite"></p></main><script src="script.js"></script></body></html>
